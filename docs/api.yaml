components:
  schemas:
    AdminUseCase:
      title: AdminUseCase
      type: object
    AudienceSegment:
      title: AudienceSegment
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
        minAge:
          type: integer
          format: int32
        maxAge:
          type: integer
          format: int32
        description:
          type: string
    AudienceSegmentUpdate:
      title: AudienceSegmentUpdate
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
        minAge:
          type: integer
          format: int32
        maxAge:
          type: integer
          format: int32
        description:
          type: string
    Case:
      title: Case
      type: object
      required:
        - partnerId
        - meta
        - checkpoints
        - prdMeta
        - primaryTagId
        - type
      properties:
        partnerId:
          description: 'Уникальный идентификатор партнера (NanoId, 8 символов, алфавит:
            "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz-")'
          type: string
          format: nanoid
        meta:
          $ref: "#/components/schemas/ProjectMeta"
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CreateProjectRolePayload"
        checkpoints:
          description: 'Уникальный идентификатор набора чекпоинтов (NanoId, 16 символов,
            алфавит:
            "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz-")'
          type: string
          format: nanoid
        prdMeta:
          $ref: "#/components/schemas/CasePrdMeta"
        primaryTagId:
          type: string
        tagIds:
          type: array
          uniqueItems: true
          items:
            type: string
        type:
          type: string
          const: Case
    Case1:
      title: Case
      type: object
      required:
        - title
        - description
        - primaryTagId
        - prdMeta
        - type
      properties:
        title:
          type: string
        description:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleUpdateDto"
        primaryTagId:
          type: string
        tagIds:
          type: array
          uniqueItems: true
          items:
            type: string
        prdMeta:
