openapi: 3.1.0
info:
  title: Апи бекенда витрины проектов тпу
  version: 0.0.1
servers:
  - url: https://project.tpu.ru/dev/api
  - url: https://project.tpu.ru/api
  - url: http://localhost:8080/api
paths:
  /auth/login:
    post:
      tags:
        - auth
      operationId: postAuthLogin
      parameters:
        - name: Origin
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeReq"
        required: true
      responses:
        "200":
          description: ""
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
        "400":
          description: Ошибка валидации запроса. Убедись, что все обязательные поля (code,
            codeVerifier) ​​заполнены и не пусты.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: INVALID_REQ
                msg: Invalid request
        "502":
          description: API ТПУ вернул ошибку или недействительный ответ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: UPSTREAM_ERROR
                msg: External auth provider error
        "504":
          description: Запрос к API ТПУ истек по времени. Вероятно он сейчас лежит)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: UPSTREAM_TIMEOUT
                msg: External auth provider timeout
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /auth/refresh:
    post:
      tags:
        - auth
      operationId: postAuthRefresh
      parameters:
        - name: accessToken
          in: cookie
          required: false
          schema:
            type: string
        - name: refreshToken
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "200":
          description: ""
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
        "403":
          description: Рефреш токен отсутствует или невалиден. Нужно залогиниться.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: INVALID_COOKIE
                msg: Refresh token cookie missing or invalid
        "422":
          description: Сессия не найдена или истекла. Нужно залогиниться.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: SESSION_NOT_FOUND
                msg: Session not found or expired
        "502":
          description: API ТПУ вернул ошибку или недействительный ответ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: UPSTREAM_ERROR
                msg: External auth provider error
        "504":
          description: Запрос к API ТПУ истек по времени. Вероятно он сейчас лежит)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: UPSTREAM_TIMEOUT
                msg: External auth provider timeout
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /auth/logout:
    post:
      tags:
        - auth
      operationId: postAuthLogout
      parameters:
        - name: accessToken
          in: cookie
          required: false
          schema:
            type: string
        - name: refreshToken
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "200":
          description: ""
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
        "403":
          description: Отсутствует или недействителен рефреш токен. Запрос на выход
            отклонен. (что? да!)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: INVALID_COOKIE
                msg: Refresh token cookie missing or invalid
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /users/{targetId}:
    get:
      tags:
        - user
      operationId: getUsersTargetid
      parameters:
        - name: targetId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Профиль пользователя. Поле roles содержит структуры разных ролей.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Invalid value for: path parameter targetId"
          content:
            text/plain:
              schema:
                type: string
        "422":
          description: Пользователь не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: USER_NOT_FOUND
                msg: User not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /users:
    get:
      tags:
        - user
      operationId: getUsers
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            default: 0
            type: integer
            format: int32
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            default: 20
            type: integer
            format: int32
            minimum: 1
            maximum: 50
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Список карточек пользователей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindUserCardResponse"
        "400":
          description: "Invalid value for: query parameter offset, Invalid value for:
            query parameter limit"
          content:
            text/plain:
              schema:
                type: string
        "422":
          description: Пользователь не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: USER_NOT_FOUND
                msg: User not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /partners:
    get:
      tags:
        - partners
      operationId: getPartners
      parameters:
        - name: query
          in: query
          description: Поисковый запрос
          required: false
          schema:
            default: ""
            type: string
        - name: offset
          in: query
          description: Смещение
          required: false
          schema:
            default: 0
            type: integer
            format: int32
            minimum: 0
        - name: limit
          in: query
          description: Лимит результатов
          required: false
          schema:
            default: 10
            type: integer
            format: int32
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerListResponse"
        "400":
          description: "Invalid value for: query parameter offset, Invalid value for:
            query parameter limit"
          content:
            text/plain:
              schema:
                type: string
        "422":
          description: Партнёр не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: PARTNER_NOT_FOUND
                msg: Partner not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
    post:
      tags:
        - partners
      operationId: postPartners
      parameters:
        - name: accessToken
          in: cookie
          required: false
          schema:
            type: string
      requestBody:
        description: Данные для создания партнера
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePartnerRequest"
        required: true
      responses:
        "200":
          description: Созданный партнер
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePartnerResponse"
        "400":
          description: Ошибка валидации партнёра или неверный формат тела запроса.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: КОД_ПЕНИС
                msg: Inappropriate phrase found
        "403":
          description: Недостаточно прав на создание нового партнёра. Нужна роль Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: INSUFFICIENT_PERMISSIONS
                msg: Only admin can manage partners
        "422":
          description: Указанный партнёр не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: PARTNER_NOT_FOUND
                msg: Partner not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /partners/{partnerId}:
    get:
      tags:
        - partners
      operationId: getPartnersPartnerid
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerResponse"
        "422":
          description: Партнёр не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: PARTNER_NOT_FOUND
                msg: Partner not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /projects/{projectId}:
    get:
      tags:
        - project
      operationId: getProjectsProjectid
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "422":
          description: Проект не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: PROJECT_NOT_FOUND
                msg: PROJECT not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
    delete:
      tags:
        - project
      operationId: deleteProjectsProjectid
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: accessToken
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Проект успешно удален
        "403":
          description: Недостаточно прав на создание нового проекта.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: INSUFFICIENT_PERMISSIONS
                msg: You can't manage projects
        "422":
          description: Указанный проект не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: PROJECT_NOT_FOUND
                msg: PROJECT not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
    patch:
      tags:
        - project
      operationId: patchProjectsProjectid
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: accessToken
          in: cookie
          required: false
          schema:
            type: string
      requestBody:
        description: Данные для обновления проекта
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
        required: true
      responses:
        "200":
          description: Обновленный проект
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: "Invalid value for: body"
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Недостаточно прав на создание нового проекта.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: INSUFFICIENT_PERMISSIONS
                msg: You can't manage projects
        "422":
          description: Указанный проект не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: PROJECT_NOT_FOUND
                msg: PROJECT not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /projects:
    get:
      tags:
        - project
      operationId: getProjects
      parameters:
        - name: q
          in: query
          description: Текстовый запрос
          required: false
          schema:
            default: ""
            type: string
        - name: projectType
          in: query
          description: "Фильтр по типу проекта: Study | Case | Real"
          required: false
          schema:
            default: []
            type: array
            items:
              type: string
        - name: status
          in: query
          description: Фильтр по статусу (можно несколько). Для статусов кроме
            Active/Completed нужна capability CanSearchAnyProjects
          required: false
          schema:
            default: []
            type: array
            items:
              type: string
        - name: tagId
          in: query
          description: Фильтр по ID тега (можно несколько)
          required: false
          schema:
            default: []
            type: array
            items:
              type: string
        - name: roleTypeId
          in: query
          description: Фильтр по ID типа роли (можно несколько)
          required: false
          schema:
            default: []
            type: array
            items:
              type: string
        - name: userId
          in: query
          description: Фильтр по ID участника роли (можно несколько)
          required: false
          schema:
            default: []
            type: array
            items:
              type: integer
              format: int32
        - name: managerId
          in: query
          description: Фильтр по ID менеджера проекта (можно несколько)
          required: false
          schema:
            default: []
            type: array
            items:
              type: integer
              format: int32
        - name: sort
          in: query
          description: "Сортировка: relevance | created_asc | created_desc"
          required: false
          schema:
            default: relevance
            type: string
        - name: offset
          in: query
          description: Смещение
          required: false
          schema:
            default: 0
            type: integer
            format: int32
        - name: limit
          in: query
          description: Лимит (макс. 100)
          required: false
          schema:
            default: 20
            type: integer
            format: int32
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSearchResponse"
        "400":
          description: "Invalid value for: query parameter userId, Invalid value for:
            query parameter managerId, Invalid value for: query parameter
            offset, Invalid value for: query parameter limit"
          content:
            text/plain:
              schema:
                type: string
        "422":
          description: Проект не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: PROJECT_NOT_FOUND
                msg: PROJECT not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
    post:
      tags:
        - project
      operationId: postProjects
      parameters:
        - name: accessToken
          in: cookie
          required: false
          schema:
            type: string
      requestBody:
        description: Данные для создания проекта
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
        required: true
      responses:
        "200":
          description: Id созданного проекта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectResponse"
        "400":
          description: "Invalid value for: body"
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Недостаточно прав на создание нового проекта.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: INSUFFICIENT_PERMISSIONS
                msg: You can't manage projects
        "422":
          description: Указанный проект не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: PROJECT_NOT_FOUND
                msg: PROJECT not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /skills:
    get:
      tags:
        - skills
      operationId: getSkills
      parameters:
        - name: query
          in: query
          description: Поисковый запрос
          required: false
          schema:
            default: ""
            type: string
        - name: offset
          in: query
          description: Смещение
          required: false
          schema:
            default: 0
            type: integer
            format: int32
        - name: limit
          in: query
          description: Лимит результатов
          required: false
          schema:
            default: 10
            type: integer
            format: int32
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
        "400":
          description: Ошибка валидации параметров поиска.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: INVALID_INPUT
                msg: Invalid input parameters
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
    post:
      tags:
        - skills
      operationId: postSkills
      parameters:
        - name: accessToken
          in: cookie
          required: false
          schema:
            type: string
      requestBody:
        description: Данные для создания скилла
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkillPayload"
        required: true
      responses:
        "200":
          description: Id cозданного скилла
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSkillOutputPayload"
        "400":
          description: Ошибка валидации данных скилла.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: INVALID_INPUT
                msg: Invalid input parameters
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /skills/{skillId}:
    get:
      tags:
        - skills
      operationId: getSkillsSkillid
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "422":
          description: Скилл не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: SKILL_NOT_FOUND
                msg: Skill not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
    put:
      tags:
        - skills
      operationId: putSkillsSkillid
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: string
        - name: accessToken
          in: cookie
          required: false
          schema:
            type: string
      requestBody:
        description: Данные для обновления скилла
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSkillPayload"
        required: true
      responses:
        "204":
          description: ""
        "400":
          description: Ошибка валидации данных скилла.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: INVALID_INPUT
                msg: Invalid input parameters
        "404":
          description: Скилл для обновления не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: SKILL_NOT_FOUND
                msg: Skill not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
    delete:
      tags:
        - skills
      operationId: deleteSkillsSkillid
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: string
        - name: accessToken
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "204":
          description: ""
        "422":
          description: Скилл для удаления не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: SKILL_NOT_FOUND
                msg: Skill not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /tags:
    get:
      tags:
        - tags
      operationId: getTags
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagGroupWithTagsResponse"
        "422":
          description: Тег не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: TAG_NOT_FOUND
                msg: Tag not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
    post:
      tags:
        - tags
      operationId: postTags
      parameters:
        - name: accessToken
          in: cookie
          required: false
          schema:
            type: string
      requestBody:
        description: Данные для создания тега
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
        required: true
      responses:
        "200":
          description: Созданный тег
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTagResponse"
        "400":
          description: Ошибка валидации запроса.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: INVALID_REQ
                msg: Invalid request body or validation failed
        "403":
          description: Недостаточно прав на управление тегами. Нужна роль с CanEditTags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: INSUFFICIENT_PERMISSIONS
                msg: You do not have permission to edit tags
        "409":
          description: A non-empty tag group cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                code: CONFLICT
                msg: A non-empty tag group cannot be deleted
        "422":
          description: Тег не найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
